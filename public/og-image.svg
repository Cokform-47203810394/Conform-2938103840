<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">콕폼 — 원하는 대로, 콕 묻고 받아요</title>
  <desc id="desc">한국 실무에 맞춘 개인정보 보호형 폼 빌더</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5B46"/>
      <stop offset="1" stop-color="#123D31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#08291F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#F5F3EC"/>
  <circle cx="1120" cy="-36" r="216" fill="#D8ED59" opacity="0.95"/>
  <circle cx="70" cy="642" r="192" fill="#EAF7EF"/>
  <rect x="650" y="0" width="550" height="630" fill="url(#hero)"/>
  <path d="M650 0C716 80 734 156 702 238c-44 112 36 216 72 392H650V0Z" fill="#17866D" opacity="0.34"/>

  <image href="brand/cokform-mark.svg" x="80" y="70" width="70" height="70"/>
  <text x="168" y="112" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="29" font-weight="800" fill="#123D31">콕폼</text>
  <text x="168" y="138" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#17866D">원하는 대로, 콕 묻고 받아요</text>

  <text x="80" y="232" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" letter-spacing="3.2" fill="#17866D">KOREAN WORK FORM BUILDER</text>
  <text x="80" y="318" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="64" font-weight="800" letter-spacing="-3.2" fill="#17251F">필요한 것을 묻고,</text>
  <text x="80" y="398" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="64" font-weight="800" letter-spacing="-3.2" fill="#17251F">내 방식대로 받으세요.</text>
  <text x="80" y="476" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#59645E">상담 · 예약 · 참가 신청 · 출결 · 견적</text>
  <text x="80" y="518" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="600" fill="#78837C">응답은 브라우저에서 암호화되어 작성자만 읽도록 설계합니다.</text>

  <g filter="url(#shadow)">
    <rect x="760" y="112" width="356" height="404" rx="30" fill="#FFFDF8"/>
    <rect x="790" y="146" width="166" height="16" rx="8" fill="#17866D" opacity="0.95"/>
    <rect x="790" y="176" width="250" height="13" rx="6.5" fill="#DDE1D9"/>
    <rect x="790" y="202" width="210" height="13" rx="6.5" fill="#E9ECE6"/>
    <rect x="790" y="250" width="286" height="90" rx="18" fill="#F0FAF6" stroke="#B7DCC8"/>
    <circle cx="822" cy="283" r="11" fill="#17866D"/>
    <rect x="844" y="274" width="170" height="15" rx="7.5" fill="#345247"/>
    <rect x="844" y="301" width="112" height="11" rx="5.5" fill="#A1AAA4"/>
    <rect x="790" y="364" width="286" height="52" rx="15" fill="#FFFFFF" stroke="#DDE1D9"/>
    <circle cx="820" cy="390" r="8" fill="#73B99D"/>
    <rect x="840" y="383" width="158" height="13" rx="6.5" fill="#59645E"/>
    <rect x="790" y="438" width="144" height="42" rx="21" fill="#0F5B46"/>
    <text x="862" y="465" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">폼 만들기</text>
