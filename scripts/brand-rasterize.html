<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style id="page-style">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="brand-asset" alt="" />
    <script>
      const params = new URLSearchParams(window.location.search);
      const asset = params.get("asset");
      const width = Number(params.get("width"));
      const height = Number(params.get("height"));

      if (!asset || !Number.isFinite(width) || !Number.isFinite(height)) {
        document.body.textContent = "Missing asset dimensions.";
        throw new Error("Missing asset dimensions.");
      }

      const image = document.getElementById("brand-asset");
      image.width = width;
      image.height = height;
      image.src = `../public/brand/${asset}`;
      document.getElementById("page-style").textContent += `\n@page { size: ${width}px ${height}px; margin: 0; }`;
      image.addEventListener("load", () => {
        document.title = "brand-asset-ready";
      });
    </script>
  </body>
</html>
